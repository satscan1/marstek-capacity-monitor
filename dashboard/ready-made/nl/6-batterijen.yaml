            pw: 'cannot be right', pwVal: 'check sensor', pwTip: (n, lim) => `A battery cannot do more than ${lim} %: more energy was counted than fits in it. Almost always the power sensor is the cause (stays on its last value instead of falling back to 0 W, wrong sensor or wrong factor). These measurements do not count (${n} so far). See Settings → Repairs.`, chk: 'model?', chkTip: 'About half of the set capacity: usually a wrong model, not a worn battery. A Venus C has 2.56 kWh, half a Venus E. See Settings → Repairs.',
            collecting: 'collecting data',
            mon: {
              measuring: n => `Monitor working · ${n} full discharge${n === 1 ? '' : 's'} measured`,
              collecting: 'Monitor working · collecting data for the first measurement',
              no_recent_data: m => `No new data for ${m} min · check the battery connection`,
              sensor_missing: e => `Sensor unavailable: ${e}`,
              waiting_full_charge: s => `Next step: charge fully to 95 % or more (now ${s} %)`,
              ready: s => `Battery full (${s} %): a discharge to 15 % or lower gives a measurement`,
              full_discharge_running: (f, s) => `Full discharge running: from ${f} % to now ${s} %, measured at 15 % or lower`,
              full_discharge_reached: (f, s) => `Full discharge reached: from ${f} % to ${s} %. The measurement is saved as soon as the battery charges again.`,
              interrupted: 'last discharge did not count (interrupted)'
            },
            chart: 'Chart', win3: 'recent 3 years of warranty', chartTitle: 'Remaining per month (%)', noData: 'No measurements in this period yet. The chart fills after the first full discharge.',
            legCap: 'measured, calibrated', legOpen: 'less reliable', legSpec: 'expected per spec', legRed: 'report to Marstek',
            less: 'less reliable', why: {no_calibration: 'not completely full in the 14 days before the measurement', cold: 'cells colder than 5 °C', soc_edge: 'the SOC meter did not keep pace at the start or end of the discharge'},
            high: n => `provisional ${n}/5`, highTip: 'Higher than new. Often that is right: new cells often deliver a little more than the rating plate says, and the battery works at a slightly higher voltage than the rating plate assumes. It can also come from the battery\'s SOC meter. After 5 measurements close together (no more than 3 points apart) it turns green.',
            highOk: 'above new', highOkTip: '5 measurements in a row above 100 % and close together: this battery delivers more than its rating plate says. New cells often do, and the battery works at a slightly higher voltage than the rating plate assumes.',
            drop: 'not confirmed yet', dropTip: (ref, n) => `The measurements are suddenly more than 5 points lower than before (was ${ref} %). Real wear is slow; a jump like this is nearly always the battery\'s SOC meter shifting for a while, for example in the cold or when the battery has not been completely full for a long time. Tip: discharge the battery once to the discharge limit and then charge it fully in one go. If the value stays low for 5 measurements (now ${n} of 5), it counts as real.`,
            since: v => `${v} % since monitoring began`, sinceTip: b => `Compared with the start of this monitor: the middle of its first 3 measurements (${b} %). Not compared with new: for a battery that was already in use, this is the drop since the monitor started measuring.`, refAge: d => `last completely full ${d} days before the measurement`,
            rep: {pill: 'Report', title: 'Report and back-up', q: 'What do you want to keep or share?',
              full: ['Full back-up', 'Everything, also names. To keep yourself or to restore (Configure → Restore back-up).'],
              anonymous: ['Anonymous to share', 'No names or ids. At the top it says what you share.'],
              marstek: ['For Marstek', 'Summary, capacity per month and measurements, in English.'],
              note: 'The report opens in a new tab. "Download report" saves it as one file; the data is in it too.',
              demo: 'The demo makes no report.', fail: 'The report could not be opened.'},
            setup: 'Settings', close: 'Close', offH: '<b>Messages off</b> · for information only (setting)', dismiss: 'Dismiss', gone: 'Dismissed · comes back with a new series.',
            soc: {pill: 'SOC', q: 'Is my SOC meter still right?',
              days: n => n === null ? 'not seen yet' : n === 0 ? 'today' : n === 1 ? 'yesterday' : `${n} days ago`,
              okH: d => `<b>OK</b> · last completely full: ${d} · the SOC meter is right`,
              letH: l => `<b>Attention</b> · the SOC meter was clearly off twice recently${l}`,
              advH: (n, l) => `<b>SOC drift detected</b> · the SOC meter was clearly off ${n}× in 45 days${l}`,
              last: v => ` (last ${v} %)`, lastNoFull: ' (not completely full for a long time)',
              letBox: 'To prevent SOC drift: discharge the battery <b>once</b> down to the discharge limit, then charge it to full in one go, until charging really stops.',
              advBox: 'Advice: discharge the battery <b>twice</b> down to the discharge limit and charge it to full in one go each time, until charging really stops. The monitor sees this itself; then this advice disappears.',
              full: 'Days completely full', ok: 'SOC meter was right', off: v => `⚠ ${v} %`,
              dev: v => `largest deviation ${v} %`, b99: v => `when charging, ${v} % more went in while it showed 99 %`, jump: v => `largest jump ${v} %`,
              hang: v => `stayed at 100 % for ${v} % of a discharge`, nofull: v => `longest not completely full: ${v} days`,
              words: {up: 'higher', down: 'lower', flat: 'stable', good: 'good', bad: 'off'},
              sub: l => `✓ = less than ${l} % off · ⚠ = how much it was off. Details when you point at a cell.`,
              none: 'No data yet: the monitor keeps track of this from now on.'},
            cell: {pill: 'Cells', q: 'Are my cells still in balance?',
              normal: b => ` (normally ${b} mV)`,
              okH: (mv, nrm) => `<b>OK</b> · cell spread after a full charge ${mv} mV${nrm}`,
              letH: mv => `<b>Attention</b> · cell spread 2× higher than normal (2 measurements in a row, now ${mv} mV)`,
              advH: (n, mv) => `<b>Cell calibration advised</b> · cell spread 2× higher than normal (${n}× in 45 days, now ${mv} mV)`,
              letBox: 'Charge the battery to full and keep it full for about <b>4 hours</b> (if your model has UPS mode: switch it on in the Marstek app for 4 hours, then back to your own mode).',
              advBox: 'Advice: cell calibration — charge to full and switch on <b>UPS mode for 8 hours</b> in the Marstek app (no UPS mode on your model: leave it in charge mode for 8 hours), then back to your own mode. Calibrating takes a long time. If the spread stays high after that, report it via the Marstek app.',
              row: 'Cells in balance',
              spread: (mv, nrm) => `cell spread after a full charge ${mv} mV${nrm}`, rest: h => `${h} hours full at rest`, temp: t => `cells ${t} °C`, n: n => `${n} measurements`,
              words: {up: 'rising', down: 'falling', flat: 'stable'},
              sub: (b, lim) => 'Highest minus lowest cell, battery full. ' + (b ? `Normal: ${b} mV, ⚠ from ${lim} mV.` : 'Normal follows from the first 3 months.'),
              none: 'No measurement yet: follows after the next full charge, once the battery has rested for 5 minutes.'},
            reason: (eol, life, tol, red) => `Manufacturer spec: ${eol} % after ${life} cycles (not a warranty). Green up to ${tol} points below, orange below that, red at ${red} % or lower.`,
            before: (n, counter) => counter ? `Of which ${n} before monitoring, estimated from the battery's total discharged counter (AC side, less exact than this monitor's DC measurement).` : `Of which ${n} before monitoring (entered by hand).`
          };
          // variables.demo (optional): fake states for a demo/gallery, nothing is written to HA
          const S = variables.demo ? {...states, ...variables.demo} : states;
          const g = k => S[`sensor.marstek_${id}_${k}`];
          const m = g('measured_capacity'), p = g('capacity_pct'), e = g('expected_capacity');
          const st = g('warranty_status'), we = g('warranty_end'), mg = g('margin');
          if (!m || !p || !e) return `<span style="color:${P.red}">${T.missing} sensor.marstek_${id}_…</span>`;
          const f = (v, d = 2) => (v === null || v === undefined || v === '' || isNaN(v)) ? '–'
            : Number(v).toLocaleString(T.loc, {minimumFractionDigits: d, maximumFractionDigits: d});
          const a = m.attributes, ea = e.attributes;
          const meas = parseFloat(m.state), pct = parseFloat(p.state), exp = parseFloat(e.state);
          const floor = p.attributes.red_pct ?? 75, tol = p.attributes.tolerance_pct ?? 5;
          // About half of the set capacity: ask about the model (orange), not red
          const chk = !!st && st.state === 'check_model';
          // Newest measurement far above new: the power sensor, not the battery (orange)
          const pw = !!st && st.state === 'check_power';
          // How sure is the latest value? normal · high_provisional (above 100 %, not yet 5 stable)
          // · high_confirmed (5 stable above 100 %: green) · drop_unconfirmed (sudden drop, grey)
          const pa = p.attributes, ds = pa.display_state || (pct > 100 ? 'high_provisional' : 'normal');
          const col = (v, x = exp) => isNaN(v) || (v > 100 && ds !== 'high_confirmed') ? P.muted : v <= floor ? (chk ? P.orange : P.red) : v >= x - tol ? P.green : P.orange;
          // Colour of the latest value: grey while it is not confirmed
          const colNow = v => ['high_provisional', 'drop_unconfirmed'].includes(ds) ? P.muted : col(v);
          const name = variables.name || id.toUpperCase();
          const status = st ? (T.status[st.state] || st.state) : '';
          const muted = `color:${P.muted}`;
          const act = js => `onclick="event.stopPropagation();const h=this.getRootNode().host;${js}h._config={...h._config};"`;

          // Explanation behind ⓘ: hover on a computer, tap to open it as a popup (phones)
          const infoText = pw ? T.pwTip(pa.impossible_count ?? 1, f(pa.impossible_limit_pct ?? 130, 0)) : chk ? T.chkTip : ds === 'drop_unconfirmed' ? T.dropTip(f(pa.drop_ref_pct, 1), pa.confirm_count ?? 1)
            : ds === 'high_confirmed' ? T.highOkTip : pct > 100 ? T.highTip : '';
          const info = (key, tip, html) => `<span ${act(`h._mcPanel=h._mcPanel==='${key}'?'':'${key}';`)} title="${tip}" style="cursor:pointer;pointer-events:auto">${html}</span>`;

          // Three capacities, strictly apart
          const box = (lbl, val, sub, c) => `
            <div style="flex:1;background:${P.box};border-radius:8px;padding:8px 10px">
              <div style="font-size:11px;${muted}">${lbl}</div>
              <div style="font-size:18px;font-weight:600;color:${c}">${val}</div>
              <div style="font-size:11px;${muted}">${sub}</div></div>`;
          const boxes = `<div style="display:flex;gap:8px;margin:4px 0 10px">
            ${box(T.nominal, f(a.nominal_kwh) + ' kWh', '100 %', P.text)}
            ${box(T.usable, f(a.usable_kwh) + ' kWh', '− ' + f(a.reserve_kwh) + ' kWh', P.blue)}
            ${pw ? box(T.measured, `<span style="font-size:13px">${T.pwVal}</span>`, info('info', infoText, `${f(pa.impossible_last_pct, 1)} % · ${T.pw} ⓘ`), P.orange) : box(T.measured, isNaN(meas) ? `<span style="font-size:13px;font-weight:400;${muted}">${T.collecting}</span>` : f(meas) + ' kWh', isNaN(pct) ? '' : (ds === 'drop_unconfirmed'
              ? info('info', infoText, `${f(pct, 1)} % · ${T.drop} ⓘ`) : ds === 'high_provisional'
              ? info('info', infoText, `${f(pct, 1)} % · ${T.high(pa.confirm_count ?? 1)} ⓘ`) : ds === 'high_confirmed'
              ? info('info', infoText, `${f(pct, 1)} % · ${T.highOk} ⓘ`) : chk
              ? info('info', infoText, `${f(pct, 1)} % · ${T.chk} ⓘ`) : f(pct, 1) + ' % ' + T.ofnew)
              + (pa.since_start_pct != null ? `<br>${info('since', T.sinceTip(f(pa.baseline_pct, 1)), T.since((pa.since_start_pct > 0 ? '+' : pa.since_start_pct < 0 ? '−' : '± ') + f(Math.abs(pa.since_start_pct), 1)) + ' ⓘ')}` : ''), colNow(pct))}
          </div>`;

          // Bar: measured vs expected vs warranty floor (0-100 % of usable)
          const bar = `<div style="position:relative;height:10px;background:${P.line};border-radius:5px;margin:14px 0 4px">
              <div style="position:absolute;left:0;top:0;bottom:0;width:${isNaN(pct) ? 0 : Math.min(pct, 100)}%;background:${colNow(pct)};border-radius:5px"></div>
              <div title="${T.expected}" style="position:absolute;top:-4px;bottom:-4px;left:${exp}%;width:2px;background:${P.text}"></div>
              <div title="${T.floor}" style="position:absolute;top:-4px;bottom:-4px;left:${floor}%;width:2px;background:${P.red}"></div>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:11px;${muted}">
              <span><span style="color:${P.red}">▎</span>${T.floor} ${f(floor, 0)} %</span>
              <span><span style="color:${P.text}">▎</span>${T.expected} ${f(exp, 1)} %</span>
            </div>`;

          const hasMargin = mg && !isNaN(parseFloat(mg.state));
          const specTip = `${T.spec} ${f(ea.cycles, 0)} ${T.cycles}: ${f(ea.expected_kwh)} kWh (${f(exp, 1)} %). ${T.reason(f(ea.cycle_eol_pct ?? 80, 0), f(ea.cycle_life ?? 6000, 0), f(tol, 0), f(floor, 0))}${ea.initial_cycles > 0 ? ' ' + T.before(f(ea.initial_cycles, 0), ea.cycle_counter) : ''}`;
          const expLine = `<div style="margin-top:8px;font-size:12px" title="${specTip}">${hasMargin
              ? `${T.margin[0].toUpperCase() + T.margin.slice(1)} <b style="color:${colNow(pct)}">${parseFloat(mg.state) >= 0 ? '+' : ''}${f(mg.state)} kWh</b> · ` : ''}${f(ea.cycles, 0)} ${T.cycles} · ${f(ea.age_years, 1)} ${T.age}</div>`;

          // No monthly row on the card: the chart shows the months (pattern first)
          const none = g('monitor_status') ? '' : `<div style="margin-top:10px;font-size:12px;${muted}">${T.none}</div>`;

          const dt = k => { const e = g(k); return e && !['unknown', 'unavailable', ''].includes(e.state)
            ? new Date(e.state).toLocaleString(T.loc, {day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'}) : '–'; };
          const foot = `<div style="margin-top:8px;font-size:11px;${muted}">
              ${T.lastDis} ${dt('last_full_discharge')} · ${T.lastChg} ${dt('last_full_charge')}${variables.version ? ` · v${variables.version}` : ''}</div>`;

          // Is the monitor itself working? (status sensor)
          const ms = g('monitor_status');
          let monLine = '';
          if (ms) {
            const sa = ms.attributes, M = T.mon;
            const dotc = {measuring: P.green, collecting: P.blue, no_recent_data: P.orange, sensor_missing: P.red}[ms.state] || P.muted;
            const main = ms.state === 'measuring' ? M.measuring(sa.full_discharges ?? 0)
              : ms.state === 'no_recent_data' ? M.no_recent_data(sa.last_data_minutes ?? '?')
              : ms.state === 'sensor_missing' ? M.sensor_missing((sa.missing || []).join(', '))
              : M.collecting;
            const soc = sa.soc ?? '–';
            const step = ['measuring', 'collecting'].includes(ms.state)
              ? (sa.phase === 'full_discharge_running' ? (Number(soc) <= 15 ? M.full_discharge_reached : M.full_discharge_running)(f(sa.from_soc, 0), soc)
                : sa.phase === 'ready' ? M.ready(soc) : M.waiting_full_charge(soc)) : '';
            const intr = sa.interrupted ? ` · ${M.interrupted}` : '';
            const showStep = step && (ms.state !== 'measuring' || sa.phase === 'full_discharge_running' || sa.interrupted);
            monLine = `<div style="margin-top:6px;font-size:12px"${step && !showStep ? ` title="${step}"` : ''}><span style="color:${dotc}">●</span> ${main}
              ${showStep ? `<div style="font-size:11px;${muted};margin-left:14px">${step}${intr}</div>` : ''}</div>`;
          }

          // Buttons Chart · SOC · Cells under the status line: one panel open at a time.
          const panel = (this && this._mcPanel) || '';
          const gone = (this && this._mcGone) || '';  // clicked away on a demo card
          const msg = (this && this._mcMsg) || '';  // message under the report buttons
          const sh = g('soc_health'), ch = g('cell_health'), cs = g('cell_spread');
          // Let op (⚠) / advice (🔧) as coloured icons: an emoji keeps its own grey colours and does not stand out
          const icon = (k, sz = 14) => `<svg viewBox="0 0 24 24" width="${sz}" height="${sz}" style="vertical-align:-2px"><path fill="${k === 'advies' ? P.red : P.orange}" d="${k === 'advies' ? 'M22.7,19L13.6,9.9C14.5,7.6 14,4.9 12.1,3C10.1,1 7.1,0.6 4.7,1.7L9,6L6,9L1.6,4.7C0.4,7.1 0.9,10.1 2.9,12.1C4.8,14 7.5,14.5 9.8,13.6L18.9,22.7C19.3,23.1 19.9,23.1 20.3,22.7L22.6,20.4C23.1,20 23.1,19.3 22.7,19Z' : 'M13,14H11V10H13M13,18H11V16H13M1,21H23L12,2L1,21Z'}"/></svg>`;
          // Let op (⚠) / advice (🔧) that has not been clicked away
          const shown = (s, kind) => !!s && ['letop', 'advies'].includes(s.state) && !s.attributes.dismissed && !gone.includes(kind);
          const sym = s => !s || !['letop', 'advies'].includes(s.state) ? `<span style="color:${P.green}">●</span>`
            : icon(s.state === 'advies' ? 'advies' : 'letop');
          const badge = (s, kind) => shown(s, kind) ? ' ' + sym(s) : '';
          const pill = (key, label) => `<span ${act(`h._mcPanel=h._mcPanel==='${key}'?'':'${key}';`)} style="display:inline-block;margin:0 6px 4px 0;font-size:12px;padding:1px 11px;border:1px solid ${panel === key ? P.edge : P.pillLine};border-radius:12px;background:${panel === key ? P.pillOn : 'transparent'};color:${panel === key ? P.text : P.muted};cursor:pointer;user-select:none;pointer-events:auto">${label}</span>`;
          // Settings: opens this battery under Settings -> Devices & services (then the cog: Configure)
          const regEnt = (typeof hass !== 'undefined' && hass && hass.entities) ? hass.entities[`sensor.marstek_${id}_monitor_status`] : null;
          const regDev = regEnt && regEnt.device_id && hass.devices ? hass.devices[regEnt.device_id] : null;
          const entryId = variables.entry_id || (regDev && (regDev.config_entries || [])[0]) || '';
          const setupUrl = `/config/integrations/integration/marstek_capacity_monitor${entryId ? `?config_entry=${entryId}` : ''}`;
          const setup = `<span ${act(variables.demo ? 'void 0;' : `history.pushState(null,'','${setupUrl}');window.dispatchEvent(new CustomEvent('location-changed'));`)} title="${T.setup}" style="cursor:pointer;pointer-events:auto;padding:2px;line-height:0;opacity:.7"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="${P.muted}" d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.67 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z"/></svg></span>`;
          const pills = `<div style="margin-top:8px;display:flex;align-items:flex-start;gap:6px"><div style="flex:1">${pill('chart', T.chart)}${sh ? pill('soc', T.soc.pill + badge(sh, 'soc')) : ''}${ch || cs ? pill('cells', T.cell.pill + badge(ch, 'cells')) : ''}${pill('report', T.rep.pill)}</div>${setup}</div>`;
          // Report and back-up (0.5.5): opened behind the login with a short-lived signed link.
          // The tab is opened right away (within the click), so no pop-up blocker stops it.
          const openReport = v => variables.demo || !entryId ? `h._mcMsg='${T.rep.demo}';`
            : `const w=window.open('about:blank','_blank');h.hass.callWS({type:'auth/sign_path',path:'/api/marstek_capacity_monitor/report/${entryId}/${v}',expires:600}).then(r=>{if(w)w.location.href=r.path;else location.href=r.path;}).catch(()=>{if(w)w.close();h._mcMsg='${T.rep.fail}';h._config={...h._config};});`;
          const repBtn = v => `<div ${act(openReport(v))} style="border:1px solid ${P.pillLine};border-radius:8px;padding:8px 10px;margin-top:8px;cursor:pointer;pointer-events:auto">
              <div style="font-weight:600">${T.rep[v][0]}</div><div style="font-size:11.5px;${muted};margin-top:2px">${T.rep[v][1]}</div></div>`;
          const repPanel = `<div style="margin-top:8px"><div style="${muted};font-size:12px">${T.rep.q}</div>${repBtn('full')}${repBtn('anonymous')}${repBtn('marstek')}
              <div style="font-size:11px;${muted};margin-top:8px;line-height:1.35">${msg ? `<b>${msg}</b> · ` : ''}${T.rep.note}</div></div>`;
          const dismissAct = kind => variables.demo ? `h._mcGone=(h._mcGone||'')+'${kind}';`
            : `h.hass.callService('marstek_capacity_monitor','dismiss_advice',{battery:'${id}',kind:'${kind}'});`;
          const adviceBox = (s, kind, text) => `<div style="border-left:3px solid ${s.state === 'advies' ? P.red : P.orange};background:${P.note};padding:8px 10px;border-radius:6px;margin:8px 0;font-size:12.5px">${text}<br>
              <span ${act(dismissAct(kind))} style="display:inline-block;margin-top:6px;border:1px solid ${P.edge};border-radius:10px;padding:1px 10px;font-size:11.5px;color:${P.soft};cursor:pointer;pointer-events:auto">${T.dismiss}</span></div>`;
          const advice = (s, kind, A) => shown(s, kind) ? adviceBox(s, kind, s.state === 'advies' ? A.advBox : A.letBox)
            : s && ['letop', 'advies'].includes(s.state) ? `<div style="font-size:11px;${muted};margin-top:4px">${T.gone}</div>` : '';
          const panelS = `margin-top:4px;padding:8px 10px;background:${P.panel};border-radius:8px`;
          const qS = `font-size:11px;${muted};margin-bottom:4px`, subS = `font-size:11px;${muted};margin-top:6px;line-height:1.35`;
          const thS = `${muted};font-weight:400;font-size:11px;text-align:right;padding:2px 4px;white-space:nowrap`;
          const tdS = `color:${P.text};text-align:right;padding:3px 4px;border-top:1px solid ${P.line};white-space:nowrap`;
          const td1 = `text-align:left;padding:3px 8px 3px 0;border-top:1px solid ${P.line};color:${P.soft};white-space:nowrap`;
          const monS = k => new Date(k + '-15').toLocaleString(T.loc, {month: 'short', year: '2-digit'});
          const monL = k => new Date(k + '-15').toLocaleString(T.loc, {month: 'short', year: 'numeric'});
          const nd0 = new Date(), nowKey = `${nd0.getFullYear()}-${String(nd0.getMonth() + 1).padStart(2, '0')}`;
          // Monthly table: trend column first, then newest -> oldest
          const table = (months, rows) => `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;margin-top:8px;font-size:12px">
              <tr><th></th><th style="${thS}">${T.trend}</th>${months.map(k => `<th style="${thS}">${monS(k)}</th>`).join('')}</tr>${rows}</table></div>`;
          // newest value against the middle of the other months
          const trendWord = (vals, W, badUp) => {
            if (vals.length < 2) return `<span style="${muted}">·</span>`;
            const rest = vals.slice(1).sort((x, y) => x - y), md = rest[Math.floor(rest.length / 2)];
            const c = up => (up === badUp ? P.orange : P.green);
            return vals[0] > md * 1.2 + 1 ? `<span style="color:${c(true)}">${W.up}</span>`
              : vals[0] < md / 1.2 - 1 ? `<span style="color:${c(false)}">${W.down}</span>` : `<span style="${muted}">${W.flat}</span>`;
          };

          // SOC panel: is the SOC meter still right?
          let socPanel = '';
          if (sh) {
            const A = T.soc, sa = sh.attributes;
            const tr = (sa.trend || []).slice(0, variables.months || 6);
            const ago = sa.last_calibration ? Math.max(0, Math.floor((Date.now() - new Date(sa.last_calibration)) / 86400000)) : null;
            const last = sa.last_size > 0 ? A.last(f(sa.last_size, 0)) : sa.count ? A.lastNoFull : '';
            const lim = sa.limit_pct ?? 5;
            const head = sh.state === 'advies' ? A.advH(sa.count ?? 3, last) : sh.state === 'letop' ? A.letH(last) : sa.sensitivity === 'off' ? T.offH : A.okH(A.days(ago));
            const share = t => { const d = t.month === nowKey ? nd0.getDate() : new Date(+t.month.slice(0, 4), +t.month.slice(5, 7), 0).getDate(); return 30 * t.full_days / d; };
            const tip = t => [`${monL(t.month)}: ${A.dev(f(t.dev, 0))}`, t.b99 ? A.b99(f(t.b99, 0)) : '', t.jump ? A.jump(f(t.jump, 0)) : '',
              t.hang ? A.hang(f(t.hang, 0)) : '', t.no_full_days ? A.nofull(t.no_full_days) : ''].filter(x => x).join('&#10;');
            const rows = !tr.length ? '' : `<tr><td style="${td1}">${A.full}</td><td style="${tdS}">${trendWord(tr.map(share), A.words, false)}</td>
                ${tr.map(t => `<td style="${tdS}${t.month !== nowKey && t.full_days < 7 ? `;color:${P.orange};font-weight:600` : ''}">${t.full_days}</td>`).join('')}</tr>
              <tr><td style="${td1}">${A.ok}</td><td style="${tdS}">${tr[0].dev >= lim ? `<span style="color:${P.orange}">${A.words.bad}</span>` : `<span style="color:${P.green}">${A.words.good}</span>`}</td>
                ${tr.map(t => `<td title="${tip(t)}" style="${tdS};${t.dev >= lim ? `color:${P.orange};font-weight:600` : `color:${P.green}`}">${t.dev >= lim ? A.off(f(t.dev, 0)) : '✓'}</td>`).join('')}</tr>`;
            socPanel = `<div style="${panelS}"><div style="${qS}">${A.q}</div><div>${sym(sh)} ${head}</div>${advice(sh, 'soc', A)}
                ${tr.length ? table(tr.map(t => t.month), rows) + `<div style="${subS}">${A.sub(f(lim, 0))}</div>` : `<div style="${subS}">${A.none}</div>`}</div>`;
          }

          // Cells panel: are the cells still in balance?
          let cellPanel = '';
          if (ch || cs) {
            const A = T.cell, ca = ch ? ch.attributes : {};
            const tr = ((ch || cs).attributes.trend || []).slice(0, variables.months || 6);
            const base = ca.base_mv, lim = ca.limit_mv ?? (base ? 2 * base : null);
            const nrm = base ? A.normal(f(base, 0)) : '';
            const now = f(ca.last_mv ?? (cs ? cs.state : null), 0);
            const head = !ch ? '' : ch.state === 'advies' ? A.advH(ca.count ?? 3, now) : ch.state === 'letop' ? A.letH(now) : ca.sensitivity === 'off' ? T.offH : tr.length ? A.okH(now, nrm) : '';
            const tip = t => [`${monL(t.month)}: ${A.spread(f(t.spread_mv, 0), nrm)}`, t.rest_h != null ? A.rest(f(t.rest_h, 1)) : '',
              t.temp_c != null ? A.temp(f(t.temp_c, 0)) : '', t.n ? A.n(t.n) : ''].filter(x => x).join('&#10;');
            const high = t => lim && t.spread_mv >= lim;
            const rows = !tr.length ? '' : `<tr><td style="${td1}">${A.row}</td><td style="${tdS}">${trendWord(tr.map(t => t.spread_mv), A.words, true)}</td>
                ${tr.map(t => `<td title="${tip(t)}" style="${tdS}${high(t) ? `;color:${P.orange};font-weight:600` : ''}">${high(t) ? '⚠ ' : ''}${f(t.spread_mv, 0)} mV</td>`).join('')}</tr>`;
            cellPanel = `<div style="${panelS}"><div style="${qS}">${A.q}</div>${head ? `<div>${sym(ch)} ${head}</div>` : ''}${advice(ch, 'cells', A)}
                ${tr.length ? table(tr.map(t => t.month), rows) + `<div style="${subS}">${A.sub(base ? f(base, 0) : null, lim ? f(lim, 0) : null)}</div>` : `<div style="${subS}">${A.none}</div>`}</div>`;
          }

          // Chart: the most recent 3 years (never before the installation date).
          // Open dot = less reliable: not completely full in the 14 days before, or cold cells.
          let chart = '';
          {
            const km = k => { const [yy, mm] = k.split('-').map(Number); return yy * 12 + mm - 1; };
            const nd = new Date(), nowI = nd.getFullYear() * 12 + nd.getMonth();
            const startI = nowI - Math.round((ea.age_years ?? 0) * 12);
            const x0 = Math.max(startI, nowI - 35), x1 = nowI;
            const span = Math.max(1, x1 - x0);
            const pts = (a.trend || []).filter(t => km(t.month) >= x0 && km(t.month) <= x1).slice().reverse();
            // drawn in real pixels: the card is on screen once the button was pressed
            const W = Math.max(260, Math.round(((this && this.offsetWidth) || 360) - 50)), H = 120, L = 28, R = 30, Tp = 10, B = 18;
            const lo = Math.min(70, Math.floor((Math.min(floor, ...pts.map(t => t.pct)) - 5) / 10) * 10);
            const hi = Math.max(100, Math.ceil(Math.max(0, ...pts.map(t => t.pct)) / 5) * 5);
            const X = i => L + (i - x0) * (W - L - R) / span;
            const Y = v => Tp + (hi - v) * (H - Tp - B) / (hi - lo);
            const dim = P.dim;
            let svg = '';
            for (let v = lo; v <= hi; v += 10)
              svg += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${P.grid}" stroke-width="1"/><text x="${L - 5}" y="${Y(v) + 3.5}" font-size="10" fill="${dim}" text-anchor="end">${v}</text>`;
            const y0 = Math.ceil(x0 / 12), y1 = Math.floor(x1 / 12), stepY = (y1 - y0) > 6 ? 2 : 1;
            for (let yy = y0; yy <= y1; yy += stepY) {
              if (yy * 12 < x0 || yy * 12 > x1) continue;
              svg += `<line x1="${X(yy * 12)}" x2="${X(yy * 12)}" y1="${H - B}" y2="${H - B + 4}" stroke="${dim}" stroke-width="1"/><text x="${X(yy * 12)}" y="${H - 3}" font-size="10" fill="${dim}" text-anchor="middle">${yy}</text>`;
            }
            svg += `<line x1="${L}" x2="${W - R}" y1="${Y(floor)}" y2="${Y(floor)}" stroke="${P.red}" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="4 4"/><text x="${W - R + 3}" y="${Y(floor) + 3.5}" font-size="10" fill="${P.red}" fill-opacity="0.7">${f(floor, 0)}%</text>`;
            const sp = pts.map(t => [km(t.month), t.expected_pct]);
            if (!isNaN(exp) && (!sp.length || sp[sp.length - 1][0] < nowI)) sp.push([nowI, exp]);
            if (sp.length > 1) svg += `<polyline points="${sp.map(([i, v]) => `${X(i)},${Y(v)}`).join(' ')}" fill="none" stroke="${P.muted}" stroke-opacity="0.7" stroke-width="1" stroke-dasharray="4 3"/>`;
            if (pts.length > 1) svg += `<polyline points="${pts.map(t => `${X(km(t.month))},${Y(t.pct)}`).join(' ')}" fill="none" stroke="${P.green}" stroke-opacity="0.45" stroke-width="1.2"/>`;
            const why = t => (t.why === 'both' ? 'no_calibration,cold' : String(t.why || '')).split(',').map(k => T.why[k]).filter(Boolean).join(', ');
            const tip = t => `${monL(t.month)}: ${f(t.pct, 1)} % (${T.legSpec} ${f(t.expected_pct, 0)} %${t.temp_c != null ? `, ${f(t.temp_c, 0)} °C` : ''})`
              + (t.reliable === false ? `\n${T.less}: ${why(t)}` : '') + (t.ref_age_d != null ? `\n${T.refAge(f(t.ref_age_d, 0))}` : '');
            svg += pts.map(t => { const c = col(t.pct, t.expected_pct);
              return `<circle cx="${X(km(t.month))}" cy="${Y(t.pct)}" r="${pts.length > 40 ? 2.2 : 3}" fill="${t.reliable === false ? P.panel : c}" stroke="${c}" stroke-width="1.4"><title>${tip(t)}</title></circle>`; }).join('');
            if (pts.length) { const t = pts[pts.length - 1]; svg += `<text x="${X(km(t.month))}" y="${Y(t.pct) - 6}" font-size="10" fill="${P.text}" text-anchor="middle">${f(t.pct, 0)}</text>`; }
            chart = `<div style="${panelS}">
                <div style="display:flex;flex-wrap:wrap;justify-content:space-between;column-gap:10px;font-size:11px;${muted}"><span>${T.chartTitle}</span><span>${T.win3}</span></div>
                ${pts.length ? `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%;height:auto;display:block;margin-top:4px">${svg}</svg>` : ''}
                ${pts.length ? '' : `<div style="font-size:11px;${muted};margin:4px 0">${T.noData}</div>`}
                <div style="font-size:10.5px;${muted};margin-top:2px"><span style="color:${P.green}">●</span> ${T.legCap} · <span style="color:${P.green}">○</span> ${T.legOpen} · <span style="color:${P.muted}">┄</span> ${T.legSpec} · <span style="color:${P.red}">┄</span> ${T.legRed}</div>
              </div>`;
          }

          // The chart opens in place of the capacities (same height); SOC and Cells
          // open as a popup, so the card never grows. The foot line stays at the bottom.
          const view = (key, html) => `<div style="grid-area:1/1;min-width:0;${panel === key ? '' : 'visibility:hidden'}">${html}</div>`;
          const stack = `<div style="display:grid">${view(panel === 'chart' ? '-' : panel, boxes + bar + expLine)}${view('chart', chart)}</div>`;
          const popup = (title, html) => `<div ${act(`h._mcPanel='';`)} style="position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;cursor:default;pointer-events:auto">
              <div ${act('void 0;')} style="background:${P.bg};border:1px solid ${P.line};border-radius:12px;padding:14px;width:100%;max-width:560px;max-height:85vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.5);color:${P.text};font-size:13px;text-align:left">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="font-size:15px;font-weight:600">${name} · ${title}</span>
                  <span ${act(`h._mcPanel='';`)} title="${T.close}" style="cursor:pointer;font-size:18px;line-height:1;color:${P.muted};padding:2px 6px">✕</span></div>
                ${html}</div></div>`;
          const infoPct = pw ? pa.impossible_last_pct : pct;
          const pop = panel === 'soc' && socPanel ? popup(T.soc.pill, socPanel) : panel === 'cells' && cellPanel ? popup(T.cell.pill, cellPanel)
            : panel === 'report' ? popup(T.rep.title, repPanel)
            : panel === 'info' && infoText ? popup(T.measured, `<div style="margin-top:10px;line-height:1.45">${f(infoPct, 1)} % — ${infoText}</div>`)
            : panel === 'since' && pa.since_start_pct != null ? popup(T.measured, `<div style="margin-top:10px;line-height:1.45">${T.since((pa.since_start_pct > 0 ? '+' : pa.since_start_pct < 0 ? '−' : '± ') + f(Math.abs(pa.since_start_pct), 1))} — ${T.sinceTip(f(pa.baseline_pct, 1))}</div>`) : '';

          return `<div style="display:flex;flex-direction:column;height:100%">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
              <span style="font-size:15px;font-weight:600">${name} · ${T.title}</span>
              <div style="text-align:right;flex-shrink:0;font-size:12px;color:${pw ? P.orange : colNow(pct)}"${pw || chk ? ` title="${infoText}"` : ''}>${status}</div></div>
            ${monLine}${pills}${stack}${none}<div style="margin-top:auto">${foot}</div>${pop}</div>`;
        ]]]

