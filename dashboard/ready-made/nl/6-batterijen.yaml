            const expNow = r.e ? parseFloat(r.e.state) : NaN;
            const ds = r.p ? (r.p.attributes.display_state || (parseFloat(r.p.state) > 100 ? 'high_provisional' : 'normal')) : 'normal';
            const col = (v, x = expNow) => isNaN(v) || (v > 100 && ds !== 'high_confirmed') ? P.muted : v <= floor ? (r.chk ? P.orange : P.red) : v >= x - tol ? P.green : P.orange;
            const colNow = v => ['high_provisional', 'drop_unconfirmed'].includes(ds) ? P.muted : col(v);
            const name = r.b.name || r.b.id.toUpperCase();
            if (!r.m) return `<tr><td colspan="${months.length + 4}" style="color:${P.red}">sensor.marstek_${r.b.id}_… ?</td></tr>`;
            const t = r.trend.filter(x => months.includes(x.month));
            const d = t.length > 1 ? t[0].pct - t[t.length - 1].pct : 0;
            const arrow = t.length < 2 ? '·' : d > 1 ? '▲' : d < -1 ? '▼' : '▬';
            const now = parseFloat(r.p.state);
            const cells = months.map(k => {
