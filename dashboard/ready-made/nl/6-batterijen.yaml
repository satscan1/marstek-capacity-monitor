            pw: 'kann nicht stimmen', pwVal: 'Sensor prüfen', pwTip: (n, lim) => `Mehr als ${lim} % kann eine Batterie nicht: Es wurde mehr Energie gezählt, als hineinpasst. Fast immer liegt es am Leistungssensor (bleibt auf seinem letzten Wert stehen statt auf 0 W zurückzufallen, falscher Sensor oder falscher Faktor). Diese Messungen zählen nicht mit (${n} bisher). Siehe Einstellungen → Reparaturen.`, chk: 'Modell?', chkTip: 'Etwa die Hälfte der eingestellten Kapazität: meist ein falsch gewähltes Modell, keine verschlissene Batterie. Eine Venus C hat 2,56 kWh, halb so viel wie eine Venus E. Siehe Einstellungen → Reparaturen.',
