              return c ? `<td style="padding:4px 10px;text-align:right"><span style="font-weight:600;color:${col(c.pct, c.expected_pct)}">${f(c.pct)}</span><span style="font-size:10px;${muted}"> /${f(c.expected_pct)}</span></td>`
                       : `<td style="padding:4px 10px;text-align:right;${muted}">·</td>`;
            }).join('');
            return `<tr style="border-top:1px solid ${P.line}">
                <td style="padding:4px 16px 4px 0;white-space:nowrap"><span style="color:${r.pw ? P.orange : colNow(now)}">●</span> ${name}${r.s ? (() => {
                  const sym = {measuring: ['✓', P.green], collecting: ['⏳', P.blue], no_recent_data: ['⚠', P.orange], sensor_missing: ['⚠', P.red]}[r.s.state] || ['', ''];
                  return ` <span title="${T.mon[r.s.state] || r.s.state}" style="font-size:11px;color:${sym[1]}">${sym[0]}</span>`; })() : ''}${r.adv.length ? (() => {
                  const big = r.adv.some(h => h.state === 'advies');
                  return ` <span title="${T.adv}"><svg viewBox="0 0 24 24" width="13" height="13" style="vertical-align:-2px"><path fill="${big ? P.red : P.orange}" d="${big ? 'M22.7,19L13.6,9.9C14.5,7.6 14,4.9 12.1,3C10.1,1 7.1,0.6 4.7,1.7L9,6L6,9L1.6,4.7C0.4,7.1 0.9,10.1 2.9,12.1C4.8,14 7.5,14.5 9.8,13.6L18.9,22.7C19.3,23.1 19.9,23.1 20.3,22.7L22.6,20.4C23.1,20 23.1,19.3 22.7,19Z' : 'M13,14H11V10H13M13,18H11V16H13M1,21H23L12,2L1,21Z'}"/></svg></span>`; })() : ''}</td>
                <td style="padding:4px 10px;text-align:right;color:${d < -1 ? colNow(now) : P.muted}">${arrow}</td>
                <td style="padding:4px 10px;text-align:right;font-weight:600;color:${r.pw ? P.orange : colNow(now)}"${r.chk ? ` title="${T.chk}"` : ''}>${r.pw ? `<span title="${T.pw}" style="cursor:help">⚠</span>` : isNaN(now) ? `<span style="font-weight:400;font-size:11px;${muted}">${T.none}</span>` : f(now, 1) + '%'}${ds === 'drop_unconfirmed' ? ` <span title="${T.drop}" style="cursor:help;font-weight:400;font-size:11px">ⓘ</span>` : now > 100 ? ` <span title="${ds === 'high_confirmed' ? T.highOk : T.high}" style="cursor:help;font-weight:400;font-size:11px">ⓘ</span>` : ''}</td>
                ${cells}
                <td style="padding:4px 10px;text-align:right;${muted}">${f(parseFloat(r.e.state), 1)}%</td></tr>`;
          }).join('');
          return `<div style="font-size:15px;font-weight:600;margin-bottom:8px">${T.title}</div>
            <div style="overflow-x:auto"><table style="border-collapse:collapse;width:auto;font-size:13px">${head}${body}</table></div>
            <div style="margin-top:8px;font-size:11px;${muted}">${T.legend(f(lim.tolerance_pct ?? 5), f(lim.red_pct ?? 75))}</div>`;
        ]]]

