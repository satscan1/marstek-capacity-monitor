# Marstek Capacity Monitor: kant-en-klaar dashboard voor 6 batterijen
#
# Nodig: button-card (HACS -> zoek "button-card" -> Downloaden).
# Vanaf versie 0.4.0 kan het ook zonder: zie docs/01-installation.nl.md.
#
# 1. Instellingen -> Dashboards -> Voeg dashboard toe -> Leeg nieuw dashboard.
#    Geef het een naam en open het.
# 2. Potlood (rechtsboven) -> drie puntjes -> Ruwe configuratie-editor.
# 3. Selecteer alles wat er staat (Ctrl+A) en plak dit hele bestand eroverheen.
# 4. Heb je je batterijen andere codes gegeven dan mt1, mt2, mt3, mt4, mt5, mt6?
#    Vervang ze hieronder (Ctrl+F helpt). De namen kun je aanpassen bij name:.
# 5. Bewaar en sluit de editor.
#
# Indeling en wat de kaarten laten zien: docs/06-dashboard-gallery.nl.md
# Generated by scripts/build_ready_dashboards.py - do not edit by hand.

button_card_templates:

  marstek_capacity_base:
    show_name: false
    show_icon: false
    show_state: false
    tap_action:
      action: none
    variables:
      months: 6
    styles:
      card:
        - background: "[[[ return (hass.themes && hass.themes.darkMode === false) ? '#ffffff' : '#1e2128' ]]]"
        - border: "[[[ return (hass.themes && hass.themes.darkMode === false) ? '1px solid #e0e3e7' : '1px solid #333744' ]]]"
        - border-radius: 12px
        - padding: 14px
        - color: "[[[ return (hass.themes && hass.themes.darkMode === false) ? '#1f2328' : '#e8eaed' ]]]"
        - font-size: 13px
        - height: 100%
      grid:
        - grid-template-areas: '"body"'
        - grid-template-columns: 1fr
        - align-items: start
      custom_fields:
        body:
          - justify-self: stretch
          - white-space: normal
          - align-self: start
          - text-align: left

  # -------------------------------------------------------------------------
  # One battery: three capacities, expectation, monthly trend
  # -------------------------------------------------------------------------
  marstek_capacity_battery:
    template: marstek_capacity_base
    # Three small buttons under the status line: Chart · SOC · Cells. One panel
    # is open at a time; press the same button again to close it. A ⚠ (let op)
    # or 🔧 (advice) on a button means: look inside. The rest of the card does
    # nothing when clicked.
    variables:
      battery: mt1
      name: ""
    custom_fields:
      body: |
        [[[
          // Colours: dark (the original look) or light, following the Home Assistant theme
