               text: '#e8eaed', soft: '#c4c7cc', muted: '#9aa0a6', dim: '#6f747b', grid: '#2a2e37', green: '#66bb6a', orange: '#ffa726', red: '#ef5350', blue: '#42a5f5'}
            : {bg: '#ffffff', box: '#f3f4f6', panel: '#f6f7f9', note: '#fff6e8', line: '#e0e3e7', edge: '#9aa0a6', pillLine: '#d0d4da', pillOn: '#e6e9ee',
               text: '#1f2328', soft: '#3c4043', muted: '#5f6368', dim: '#80868b', grid: '#e9ecef', green: '#2e7d32', orange: '#e65100', red: '#d32f2f', blue: '#1976d2'};
          const id = variables.battery;
          // Language: the card setting, else the language of Home Assistant
