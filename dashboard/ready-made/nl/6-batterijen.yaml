            : {title: 'Home battery capacity — % remaining per month', bat: 'Battery', pw: 'Check the power sensor: the last measurement cannot be right; see the card of that battery.', chk: 'Check the model: about half of the set capacity (Venus C = 2.56 kWh)', high: 'Higher than new: provisional until 5 measurements are close together; see the card of that battery.', highOk: 'Higher than new: 5 measurements close together, the battery delivers more than its rating plate.', drop: 'Suddenly lower: not confirmed yet, usually the battery\'s SOC meter; see the card of that battery.', trend: 'Trend', now: 'Now', exp: 'Spec', loc: 'en-GB', none: 'collecting data', mon: {measuring: 'monitor working', collecting: 'collecting data', no_recent_data: 'no recent data', sensor_missing: 'sensor unavailable'}, legend: (tol, red) => `Green: within manufacturer spec (up to ${tol} points below) · orange: below spec · red: ${red} % or lower, report via the Marstek app. Small number = spec for that month. ✓ monitor working · ⏳ collecting data · ⚠ check the connection or attention · 🔧 advice (SOC drift or cell calibration, see the card of that battery).`, adv: 'SOC drift or cell calibration: see the card of this battery'};
          const f = (v, d = 0) => (v === null || v === undefined || isNaN(v)) ? '–'
