# Marstek Capacity Monitor: ready-made dashboard for 2 batteries
#
# Needs button-card (HACS -> search "button-card" -> Download).
# From version 0.4.0 it also works without: see docs/01-installation.md.
#
# 1. Settings -> Dashboards -> Add dashboard -> New dashboard from scratch.
#    Give it a name and open it.
# 2. Pencil (top right) -> three dots -> Raw configuration editor.
# 3. Select everything that is there (Ctrl+A) and paste this whole file over it.
# 4. Did you give your batteries other codes than mt1, mt2?
#    Replace them below (Ctrl+F helps). The names can be changed at name:.
# 5. Save and close the editor.
#
# Layout and what the cards show: docs/06-dashboard-gallery.md
# Generated by scripts/build_ready_dashboards.py - do not edit by hand.

button_card_templates:

  marstek_capacity_base:
    show_name: false
    show_icon: false
    show_state: false
    tap_action:
      action: none
    variables:
      lang: en
      months: 6
    styles:
      card:
        - background: "#1e2128"
        - border: "1px solid #333744"
        - border-radius: 12px
        - padding: 14px
        - color: "#e8eaed"
        - font-size: 13px
        - height: 100%
      grid:
        - grid-template-areas: '"body"'
        - grid-template-columns: 1fr
        - align-items: start
      custom_fields:
        body:
          - justify-self: stretch
          - white-space: normal
          - align-self: start
          - text-align: left

  # -------------------------------------------------------------------------
  # One battery: three capacities, expectation, monthly trend
  # -------------------------------------------------------------------------
  marstek_capacity_battery:
    template: marstek_capacity_base
    # Three small buttons under the status line: Chart · SOC · Cells. One panel
    # is open at a time; press the same button again to close it. A ⚠ (let op)
    # or 🔧 (advice) on a button means: look inside. The rest of the card does
    # nothing when clicked.
    variables:
      battery: mt1
      name: ""
    custom_fields:
      body: |
        [[[
          const id = variables.battery;
          const nl = variables.lang === 'nl';
          const T = variables.lang === 'de' ? {
            title: 'Kapazität', nominal: 'Nennwert', usable: 'Nutzbar', measured: 'Gemessen',
            ofnew: 'noch verfügbar', expected: 'Herstellerangabe', spec: 'Herstellerangabe bei', margin: 'Abstand', floor: 'an Marstek melden',
            age: 'Jahre', cycles: 'Zyklen', trend: 'Trend', exp: 'Herst.',
            until: 'Garantie bis', n: 'Messungen', lastDis: 'letzte vollständige Entladung', lastChg: 'letzte vollständige Ladung', loc: 'de-DE',
            none: 'Noch keine vollständige Entladung gemessen (≥ 95 % → ≤ 15 %). Das kann im Winter eine Weile dauern.',
            missing: 'Sensor nicht gefunden:',
            status: {good: 'Gut', attention: 'Unter Herstellerangabe', critical: 'An Marstek melden (App)', no_measurement: 'Sammelt Daten'},
            collecting: 'sammelt Daten',
            mon: {
              measuring: n => `Messung läuft · ${n} vollständige Entladung${n === 1 ? '' : 'en'} gemessen`,
              collecting: 'Messung läuft · sammelt Daten für die erste Messung',
              no_recent_data: m => `Keine neuen Daten seit ${m} min · Verbindung zur Batterie prüfen`,
              sensor_missing: e => `Sensor nicht verfügbar: ${e}`,
              waiting_full_charge: s => `Nächster Schritt: auf 95 % oder mehr voll laden (jetzt ${s} %)`,
              ready: s => `Batterie voll (${s} %): eine Entladung auf 15 % oder weniger ergibt eine Messung`,
              full_discharge_running: (f, s) => `Vollständige Entladung läuft: von ${f} % auf jetzt ${s} %, Messung bei 15 % oder weniger`,
              interrupted: 'letzte Entladung zählte nicht (unterbrochen)'
            },
            chart: 'Diagramm', win3: 'jüngste 3 Jahre der Garantiezeit', chartTitle: 'Noch verfügbar pro Monat (%)', noData: 'Noch keine Messungen in diesem Zeitraum. Das Diagramm füllt sich nach der ersten vollständigen Entladung.',
            legCap: 'gemessen, kalibriert', legOpen: 'weniger zuverlässig', legSpec: 'erwartet laut Herstellerangabe', legRed: 'an Marstek melden',
            less: 'weniger zuverlässig', why: {no_calibration: 'in den 14 Tagen vor der Messung nicht ganz voll', cold: 'Zellen kälter als 5 °C'}, refAge: d => `zuletzt ganz voll ${d} Tage vor der Messung`,
            setup: 'Einstellungen', close: 'Schließen', offH: '<b>Hinweise aus</b> · nur zur Info (Einstellung)', dismiss: 'Ausblenden', gone: 'Ausgeblendet · kommt bei einer neuen Reihe zurück.',
            soc: {pill: 'SOC', q: 'Stimmt meine SOC-Anzeige noch?',
              days: n => n === null ? 'noch nicht gesehen' : n === 0 ? 'heute' : n === 1 ? 'gestern' : `vor ${n} Tagen`,
              okH: d => `<b>In Ordnung</b> · zuletzt ganz voll: ${d} · die SOC-Anzeige stimmt`,
              letH: l => `<b>Achtung</b> · die SOC-Anzeige lag zuletzt 2× deutlich daneben${l}`,
              advH: (n, l) => `<b>SOC-Drift festgestellt</b> · die SOC-Anzeige lag ${n}× in 45 Tagen deutlich daneben${l}`,
              last: v => ` (zuletzt ${v} %)`, lastNoFull: ' (lange nicht ganz voll)',
              letBox: 'Um SOC-Drift vorzubeugen: entlade die Batterie <b>einmal</b> bis zur Entladegrenze und lade sie danach in einem Zug voll, bis das Laden wirklich stoppt.',
              advBox: 'Empfehlung: entlade die Batterie <b>zweimal</b> bis zur Entladegrenze und lade sie jedes Mal in einem Zug voll, bis das Laden wirklich stoppt. Der Monitor erkennt das selbst; danach verschwindet diese Empfehlung.',
              full: 'Tage ganz voll', ok: 'SOC-Anzeige stimmte', off: v => `⚠ ${v} %`,
              dev: v => `größte Abweichung ${v} %`, b99: v => `beim Vollladen noch ${v} % nachgeladen, während sie 99 % zeigte`, jump: v => `größter Sprung ${v} %`,
              hang: v => `blieb beim Entladen ${v} % lang auf 100 %`, nofull: v => `am längsten nicht ganz voll: ${v} Tage`,
              words: {up: 'höher', down: 'niedriger', flat: 'stabil', good: 'gut', bad: 'weicht ab'},
              sub: l => `✓ = weniger als ${l} % daneben · ⚠ = so viel daneben. Details beim Zeigen auf ein Feld.`,
              none: 'Noch keine Daten: der Monitor zeichnet das ab jetzt auf.'},
            cell: {pill: 'Zellen', q: 'Sind meine Zellen noch im Gleichgewicht?',
              normal: b => ` (normal ${b} mV)`,
              okH: (mv, nrm) => `<b>In Ordnung</b> · Zellspannungsdifferenz nach Vollladung ${mv} mV${nrm}`,
              letH: mv => `<b>Achtung</b> · Zellspannungsdifferenz 2× höher als normal (2 Messungen hintereinander, jetzt ${mv} mV)`,
              advH: (n, mv) => `<b>Zellkalibrierung empfohlen</b> · Zellspannungsdifferenz 2× höher als normal (${n}× in 45 Tagen, jetzt ${mv} mV)`,
              letBox: 'Lade die Batterie voll und lass sie etwa <b>4 Stunden</b> voll stehen (hat dein Modell einen UPS-Modus: in der Marstek-App 4 Stunden einschalten, danach zurück in deinen Modus).',
              advBox: 'Empfehlung: Zellkalibrierung — lade voll und schalte in der Marstek-App den <b>UPS-Modus 8 Stunden</b> ein (kein UPS-Modus: lass sie 8 Stunden im Lademodus), danach zurück in deinen Modus. Kalibrieren dauert lange. Bleibt die Differenz danach hoch, melde es über die Marstek-App.',
              row: 'Zellen im Gleichgewicht',
              spread: (mv, nrm) => `Zellspannungsdifferenz nach Vollladung ${mv} mV${nrm}`, rest: h => `${h} Stunden voll in Ruhe`, temp: t => `Zellen ${t} °C`, n: n => `${n} Messungen`,
              words: {up: 'steigt', down: 'sinkt', flat: 'stabil'},
              sub: (b, lim) => 'Höchste minus niedrigste Zelle, Batterie voll. ' + (b ? `Normal: ${b} mV, ⚠ ab ${lim} mV.` : 'Normal ergibt sich aus den ersten 3 Monaten.'),
              none: 'Noch keine Messung: folgt nach der nächsten Vollladung, sobald die Batterie 5 Minuten geruht hat.'},
            reason: (eol, life) => `Herstellerangabe: ${eol} % nach ${life} Zyklen (keine Garantie). Grün bis 5 Punkte darunter, orange noch tiefer, rot bei 75 % oder weniger.`
          } : nl ? {
            title: 'Capaciteit', nominal: 'Opgegeven', usable: 'Bruikbaar', measured: 'Gemeten',
            ofnew: 'nog beschikbaar', expected: 'Specificatie', spec: 'Specificatie fabrikant bij', margin: 'marge', floor: 'melden bij Marstek',
            age: 'jaar', cycles: 'cycli', trend: 'Trend', exp: 'spec.',
            until: 'garantie t/m', n: 'metingen', lastDis: 'laatste volle ontlading', lastChg: 'laatste volle lading', loc: 'nl-NL',
            none: 'Nog geen volledige ontlading gemeten (≥95% → ≤15%). Dat kan in de winter even duren.',
            missing: 'Sensor niet gevonden:',
            status: {good: 'Goed', attention: 'Onder specificatie', critical: 'Melden bij Marstek (app)', no_measurement: 'Verzamelt data'},
            collecting: 'verzamelt data',
            mon: {
              measuring: n => `Meting werkt · ${n} volledige ontlading${n === 1 ? '' : 'en'} gemeten`,
              collecting: 'Meting werkt · verzamelt data voor de eerste meting',
              no_recent_data: m => `Geen nieuwe gegevens sinds ${m} min · controleer de koppeling van de batterij`,
              sensor_missing: e => `Sensor niet beschikbaar: ${e}`,
              waiting_full_charge: s => `Volgende stap: volledig laden tot 95 % of meer (nu ${s} %)`,
              ready: s => `Batterij vol (${s} %): een ontlading tot 15 % of lager geeft een meting`,
              full_discharge_running: (f, s) => `Volledige ontlading bezig: van ${f} % naar nu ${s} %, meting bij 15 % of lager`,
              interrupted: 'vorige ontlading telde niet mee (onderbroken)'
            },
            chart: 'Grafiek', win3: 'recente 3 jaar van garantieperiode', chartTitle: 'Nog beschikbaar per maand (%)', noData: 'Nog geen metingen in deze periode. De grafiek vult zich na de eerste volledige ontlading.',
            legCap: 'gemeten, geijkt', legOpen: 'minder betrouwbaar', legSpec: 'verwacht volgens specificatie', legRed: 'melden bij Marstek',
            less: 'minder betrouwbaar', why: {no_calibration: 'in de 14 dagen vóór de meting niet helemaal vol', cold: 'cellen kouder dan 5 °C'}, refAge: d => `laatst helemaal vol ${d} dagen vóór de meting`,
            setup: 'Instellingen', close: 'Sluiten', offH: '<b>Meldingen uit</b> · alleen ter info (instelling)', dismiss: 'Wegklikken', gone: 'Weggeklikt · komt terug bij een nieuwe reeks.',
            soc: {pill: 'SOC', q: 'Klopt mijn SOC-meter nog?',
              days: n => n === null ? 'nog niet gezien' : n === 0 ? 'vandaag' : n === 1 ? 'gisteren' : `${n} dagen geleden`,
              okH: d => `<b>In orde</b> · laatst helemaal vol: ${d} · de SOC-meter klopt`,
              letH: l => `<b>Let op</b> · de SOC-meter zat de laatste tijd 2× flink ernaast${l}`,
              advH: (n, l) => `<b>SOC-drift geconstateerd</b> · de SOC-meter zat ${n}× in 45 dagen flink ernaast${l}`,
              last: v => ` (laatst ${v} %)`, lastNoFull: ' (lang niet helemaal vol)',
              letBox: 'Om SOC-drift te voorkomen: ontlaad de batterij <b>één keer</b> tot de ontlaadgrens en laad hem daarna in één keer vol, tot het laden echt stopt.',
              advBox: 'Advies: ontlaad de batterij <b>twee keer</b> tot de ontlaadgrens en laad hem elke keer in één keer vol, tot het laden echt stopt. De monitor ziet dat zelf; daarna verdwijnt dit advies.',
              full: 'Dagen helemaal vol', ok: 'SOC-meter klopte', off: v => `⚠ ${v} %`,
              dev: v => `grootste afwijking ${v} %`, b99: v => `bij vol laden nog ${v} % bijgeladen terwijl hij 99 % aangaf`, jump: v => `grootste sprong ${v} %`,
              hang: v => `bleef bij ontladen ${v} % lang op 100 % staan`, nofull: v => `langst niet helemaal vol: ${v} dagen`,
              words: {up: 'hoger', down: 'lager', flat: 'stabiel', good: 'goed', bad: 'wijkt af'},
              sub: l => `✓ = minder dan ${l} % ernaast · ⚠ = zoveel ernaast. Details bij aanwijzen van een vakje.`,
              none: 'Nog geen gegevens: de monitor houdt dit vanaf nu bij.'},
            cell: {pill: 'Cellen', q: 'Zijn mijn cellen nog in balans?',
              normal: b => ` (normaal ${b} mV)`,
              okH: (mv, nrm) => `<b>In orde</b> · celverschil na volle lading ${mv} mV${nrm}`,
              letH: mv => `<b>Let op</b> · celverschil 2× hoger dan normaal (2 metingen achter elkaar, nu ${mv} mV)`,
              advH: (n, mv) => `<b>Celkalibratie aanbevolen</b> · celverschil 2× hoger dan normaal (${n}× in 45 dagen, nu ${mv} mV)`,
              letBox: 'Laad de batterij vol en laat hem ongeveer <b>4 uur</b> vol staan (heeft je model UPS-modus: zet die in de Marstek-app 4 uur aan en daarna terug naar je eigen modus).',
              advBox: 'Advies: celkalibratie — laad vol en zet in de Marstek-app <b>UPS-modus 8 uur</b> aan (heeft je model geen UPS-modus: laat hem 8 uur in de laadmodus staan), zet hem daarna terug naar je eigen modus. Kalibreren duurt lang. Blijft het celverschil daarna hoog, meld het dan via de Marstek-app.',
              row: 'Cellen in balans',
              spread: (mv, nrm) => `celverschil na volle lading ${mv} mV${nrm}`, rest: h => `${h} uur vol in rust`, temp: t => `cellen ${t} °C`, n: n => `${n} metingen`,
              words: {up: 'stijgt', down: 'daalt', flat: 'stabiel'},
              sub: (b, lim) => 'Hoogste min laagste cel, batterij vol. ' + (b ? `Normaal: ${b} mV, ⚠ vanaf ${lim} mV.` : 'Normaal volgt uit de eerste 3 maanden.'),
              none: 'Nog geen meting: volgt na de volgende volle lading, als de batterij 5 minuten in rust is.'},
            reason: (eol, life) => `Specificatie fabrikant: ${eol} % na ${life} cycli (geen garantie). Groen tot 5 punten eronder, oranje daaronder, rood bij 75 % en lager.`
          } : {
            title: 'Capacity', nominal: 'Rated', usable: 'Usable', measured: 'Measured',
            ofnew: 'remaining', expected: 'Spec', spec: 'Manufacturer spec at', margin: 'margin', floor: 'report to Marstek',
            age: 'yr', cycles: 'cycles', trend: 'Trend', exp: 'spec',
            until: 'warranty until', n: 'measurements', lastDis: 'last full discharge', lastChg: 'last full charge', loc: 'en-GB',
            none: 'No full discharge measured yet (≥95% → ≤15%). This can take a while in winter.',
            missing: 'Sensor not found:',
            status: {good: 'Good', attention: 'Below spec', critical: 'Report to Marstek (app)', no_measurement: 'Collecting data'},
            collecting: 'collecting data',
            mon: {
              measuring: n => `Monitor working · ${n} full discharge${n === 1 ? '' : 's'} measured`,
              collecting: 'Monitor working · collecting data for the first measurement',
              no_recent_data: m => `No new data for ${m} min · check the battery connection`,
              sensor_missing: e => `Sensor unavailable: ${e}`,
              waiting_full_charge: s => `Next step: charge fully to 95 % or more (now ${s} %)`,
              ready: s => `Battery full (${s} %): a discharge to 15 % or lower gives a measurement`,
              full_discharge_running: (f, s) => `Full discharge running: from ${f} % to now ${s} %, measured at 15 % or lower`,
              interrupted: 'last discharge did not count (interrupted)'
            },
            chart: 'Chart', win3: 'recent 3 years of warranty', chartTitle: 'Remaining per month (%)', noData: 'No measurements in this period yet. The chart fills after the first full discharge.',
            legCap: 'measured, calibrated', legOpen: 'less reliable', legSpec: 'expected per spec', legRed: 'report to Marstek',
            less: 'less reliable', why: {no_calibration: 'not completely full in the 14 days before the measurement', cold: 'cells colder than 5 °C'}, refAge: d => `last completely full ${d} days before the measurement`,
            setup: 'Settings', close: 'Close', offH: '<b>Messages off</b> · for information only (setting)', dismiss: 'Dismiss', gone: 'Dismissed · comes back with a new series.',
            soc: {pill: 'SOC', q: 'Is my SOC meter still right?',
              days: n => n === null ? 'not seen yet' : n === 0 ? 'today' : n === 1 ? 'yesterday' : `${n} days ago`,
              okH: d => `<b>OK</b> · last completely full: ${d} · the SOC meter is right`,
              letH: l => `<b>Attention</b> · the SOC meter was clearly off twice recently${l}`,
              advH: (n, l) => `<b>SOC drift detected</b> · the SOC meter was clearly off ${n}× in 45 days${l}`,
              last: v => ` (last ${v} %)`, lastNoFull: ' (not completely full for a long time)',
              letBox: 'To prevent SOC drift: discharge the battery <b>once</b> down to the discharge limit, then charge it to full in one go, until charging really stops.',
              advBox: 'Advice: discharge the battery <b>twice</b> down to the discharge limit and charge it to full in one go each time, until charging really stops. The monitor sees this itself; then this advice disappears.',
              full: 'Days completely full', ok: 'SOC meter was right', off: v => `⚠ ${v} %`,
              dev: v => `largest deviation ${v} %`, b99: v => `when charging, ${v} % more went in while it showed 99 %`, jump: v => `largest jump ${v} %`,
              hang: v => `stayed at 100 % for ${v} % of a discharge`, nofull: v => `longest not completely full: ${v} days`,
              words: {up: 'higher', down: 'lower', flat: 'stable', good: 'good', bad: 'off'},
              sub: l => `✓ = less than ${l} % off · ⚠ = how much it was off. Details when you point at a cell.`,
              none: 'No data yet: the monitor keeps track of this from now on.'},
            cell: {pill: 'Cells', q: 'Are my cells still in balance?',
              normal: b => ` (normally ${b} mV)`,
              okH: (mv, nrm) => `<b>OK</b> · cell spread after a full charge ${mv} mV${nrm}`,
              letH: mv => `<b>Attention</b> · cell spread 2× higher than normal (2 measurements in a row, now ${mv} mV)`,
              advH: (n, mv) => `<b>Cell calibration advised</b> · cell spread 2× higher than normal (${n}× in 45 days, now ${mv} mV)`,
              letBox: 'Charge the battery to full and keep it full for about <b>4 hours</b> (if your model has UPS mode: switch it on in the Marstek app for 4 hours, then back to your own mode).',
              advBox: 'Advice: cell calibration — charge to full and switch on <b>UPS mode for 8 hours</b> in the Marstek app (no UPS mode on your model: leave it in charge mode for 8 hours), then back to your own mode. Calibrating takes a long time. If the spread stays high after that, report it via the Marstek app.',
              row: 'Cells in balance',
              spread: (mv, nrm) => `cell spread after a full charge ${mv} mV${nrm}`, rest: h => `${h} hours full at rest`, temp: t => `cells ${t} °C`, n: n => `${n} measurements`,
              words: {up: 'rising', down: 'falling', flat: 'stable'},
              sub: (b, lim) => 'Highest minus lowest cell, battery full. ' + (b ? `Normal: ${b} mV, ⚠ from ${lim} mV.` : 'Normal follows from the first 3 months.'),
              none: 'No measurement yet: follows after the next full charge, once the battery has rested for 5 minutes.'},
            reason: (eol, life) => `Manufacturer spec: ${eol} % after ${life} cycles (not a warranty). Green up to 5 points below, orange below that, red at 75 % or lower.`
          };
          // variables.demo (optional): fake states for a demo/gallery, nothing is written to HA
          const S = variables.demo ? {...states, ...variables.demo} : states;
          const g = k => S[`sensor.marstek_${id}_${k}`];
          const m = g('measured_capacity'), p = g('capacity_pct'), e = g('expected_capacity');
          const st = g('warranty_status'), we = g('warranty_end'), mg = g('margin');
          if (!m || !p || !e) return `<span style="color:#ef5350">${T.missing} sensor.marstek_${id}_…</span>`;
          const f = (v, d = 2) => (v === null || v === undefined || v === '' || isNaN(v)) ? '–'
            : Number(v).toLocaleString(T.loc, {minimumFractionDigits: d, maximumFractionDigits: d});
          const a = m.attributes, ea = e.attributes;
          const meas = parseFloat(m.state), pct = parseFloat(p.state), exp = parseFloat(e.state);
          const floor = p.attributes.red_pct ?? 75, tol = p.attributes.tolerance_pct ?? 5;
          const col = (v, x = exp) => isNaN(v) ? '#9aa0a6' : v <= floor ? '#ef5350' : v >= x - tol ? '#66bb6a' : '#ffa726';
          const name = variables.name || id.toUpperCase();
          const status = st ? (T.status[st.state] || st.state) : '';
          const muted = 'color:#9aa0a6';

          // Three capacities, strictly apart
          const box = (lbl, val, sub, c) => `
            <div style="flex:1;background:#262a33;border-radius:8px;padding:8px 10px">
              <div style="font-size:11px;${muted}">${lbl}</div>
              <div style="font-size:18px;font-weight:600;color:${c}">${val}</div>
              <div style="font-size:11px;${muted}">${sub}</div></div>`;
          const boxes = `<div style="display:flex;gap:8px;margin:4px 0 10px">
            ${box(T.nominal, f(a.nominal_kwh) + ' kWh', '100 %', '#e8eaed')}
            ${box(T.usable, f(a.usable_kwh) + ' kWh', '− ' + f(a.reserve_kwh) + ' kWh', '#42a5f5')}
            ${box(T.measured, isNaN(meas) ? `<span style="font-size:13px;font-weight:400;${muted}">${T.collecting}</span>` : f(meas) + ' kWh', isNaN(pct) ? '' : f(pct, 1) + ' % ' + T.ofnew, col(pct))}
          </div>`;

          // Bar: measured vs expected vs warranty floor (0-100 % of usable)
          const bar = `<div style="position:relative;height:10px;background:#333744;border-radius:5px;margin:14px 0 4px">
              <div style="position:absolute;left:0;top:0;bottom:0;width:${isNaN(pct) ? 0 : Math.min(pct, 100)}%;background:${col(pct)};border-radius:5px"></div>
              <div title="${T.expected}" style="position:absolute;top:-4px;bottom:-4px;left:${exp}%;width:2px;background:#e8eaed"></div>
              <div title="${T.floor}" style="position:absolute;top:-4px;bottom:-4px;left:${floor}%;width:2px;background:#ef5350"></div>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:11px;${muted}">
              <span><span style="color:#ef5350">▎</span>${T.floor} ${f(floor, 0)} %</span>
              <span><span style="color:#e8eaed">▎</span>${T.expected} ${f(exp, 1)} %</span>
            </div>`;

          const hasMargin = mg && !isNaN(parseFloat(mg.state));
          const specTip = `${T.spec} ${f(ea.cycles, 0)} ${T.cycles}: ${f(ea.expected_kwh)} kWh (${f(exp, 1)} %). ${T.reason(f(ea.cycle_eol_pct ?? 80, 0), f(ea.cycle_life ?? 6000, 0))}`;
          const expLine = `<div style="margin-top:8px;font-size:12px" title="${specTip}">${hasMargin
              ? `${T.margin[0].toUpperCase() + T.margin.slice(1)} <b style="color:${col(pct)}">${parseFloat(mg.state) >= 0 ? '+' : ''}${f(mg.state)} kWh</b> · ` : ''}${f(ea.cycles, 0)} ${T.cycles} · ${f(ea.age_years, 1)} ${T.age}</div>`;

          // No monthly row on the card: the chart shows the months (pattern first)
          const none = g('monitor_status') ? '' : `<div style="margin-top:10px;font-size:12px;${muted}">${T.none}</div>`;

          const dt = k => { const e = g(k); return e && !['unknown', 'unavailable', ''].includes(e.state)
            ? new Date(e.state).toLocaleString(T.loc, {day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'}) : '–'; };
          const foot = `<div style="margin-top:8px;font-size:11px;${muted}">
              ${T.lastDis} ${dt('last_full_discharge')} · ${T.lastChg} ${dt('last_full_charge')} · n=${a.measurement_count ?? 0}${variables.version ? ` · v${variables.version}` : ''}</div>`;

          // Is the monitor itself working? (status sensor)
          const ms = g('monitor_status');
          let monLine = '';
          if (ms) {
            const sa = ms.attributes, M = T.mon;
            const dotc = {measuring: '#66bb6a', collecting: '#42a5f5', no_recent_data: '#ffa726', sensor_missing: '#ef5350'}[ms.state] || '#9aa0a6';
            const main = ms.state === 'measuring' ? M.measuring(sa.full_discharges ?? 0)
              : ms.state === 'no_recent_data' ? M.no_recent_data(sa.last_data_minutes ?? '?')
              : ms.state === 'sensor_missing' ? M.sensor_missing((sa.missing || []).join(', '))
              : M.collecting;
            const soc = sa.soc ?? '–';
            const step = ['measuring', 'collecting'].includes(ms.state)
              ? (sa.phase === 'full_discharge_running' ? M.full_discharge_running(f(sa.from_soc, 0), soc)
                : sa.phase === 'ready' ? M.ready(soc) : M.waiting_full_charge(soc)) : '';
            const intr = sa.interrupted ? ` · ${M.interrupted}` : '';
            const showStep = step && (ms.state !== 'measuring' || sa.phase === 'full_discharge_running' || sa.interrupted);
            monLine = `<div style="margin-top:6px;font-size:12px"${step && !showStep ? ` title="${step}"` : ''}><span style="color:${dotc}">●</span> ${main}
              ${showStep ? `<div style="font-size:11px;${muted};margin-left:14px">${step}${intr}</div>` : ''}</div>`;
          }

          // Buttons Chart · SOC · Cells under the status line: one panel open at a time.
          const panel = (this && this._mcPanel) || '';
          const gone = (this && this._mcGone) || '';  // clicked away on a demo card
          const act = js => `onclick="event.stopPropagation();const h=this.getRootNode().host;${js}h._config={...h._config};"`;
          const sh = g('soc_health'), ch = g('cell_health'), cs = g('cell_spread');
          // Let op (⚠) / advice (🔧) that has not been clicked away
          const shown = (s, kind) => !!s && ['letop', 'advies'].includes(s.state) && !s.attributes.dismissed && !gone.includes(kind);
          const sym = s => !s || !['letop', 'advies'].includes(s.state) ? '<span style="color:#66bb6a">●</span>'
            : s.state === 'advies' ? '<span style="color:#ef5350">🔧</span>' : '<span style="color:#ffa726">⚠</span>';
          const badge = (s, kind) => shown(s, kind) ? ' ' + sym(s) : '';
          const pill = (key, label) => `<span ${act(`h._mcPanel=h._mcPanel==='${key}'?'':'${key}';`)} style="display:inline-block;margin:0 6px 4px 0;font-size:12px;padding:1px 11px;border:1px solid ${panel === key ? '#5a6170' : '#3a3f4b'};border-radius:12px;background:${panel === key ? '#2f3542' : 'transparent'};color:${panel === key ? '#e8eaed' : '#9aa0a6'};cursor:pointer;user-select:none;pointer-events:auto">${label}</span>`;
          // Settings: opens this battery under Settings -> Devices & services (then the cog: Configure)
          const regEnt = (typeof hass !== 'undefined' && hass && hass.entities) ? hass.entities[`sensor.marstek_${id}_monitor_status`] : null;
          const regDev = regEnt && regEnt.device_id && hass.devices ? hass.devices[regEnt.device_id] : null;
          const entryId = variables.entry_id || (regDev && (regDev.config_entries || [])[0]) || '';
          const setupUrl = `/config/integrations/integration/marstek_capacity_monitor${entryId ? `?config_entry=${entryId}` : ''}`;
          const setup = `<span ${act(variables.demo ? 'void 0;' : `history.pushState(null,'','${setupUrl}');window.dispatchEvent(new CustomEvent('location-changed'));`)} title="${T.setup}" style="cursor:pointer;pointer-events:auto;padding:2px;line-height:0;opacity:.7"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="#9aa0a6" d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.67 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z"/></svg></span>`;
          const pills = `<div style="margin-top:8px;display:flex;align-items:flex-start;gap:6px"><div style="flex:1">${pill('chart', T.chart)}${sh ? pill('soc', T.soc.pill + badge(sh, 'soc')) : ''}${ch || cs ? pill('cells', T.cell.pill + badge(ch, 'cells')) : ''}</div>${setup}</div>`;
          const dismissAct = kind => variables.demo ? `h._mcGone=(h._mcGone||'')+'${kind}';`
            : `h.hass.callService('marstek_capacity_monitor','dismiss_advice',{battery:'${id}',kind:'${kind}'});`;
          const adviceBox = (s, kind, text) => `<div style="border-left:3px solid ${s.state === 'advies' ? '#ef5350' : '#ffa726'};background:#2a2c31;padding:8px 10px;border-radius:6px;margin:8px 0;font-size:12.5px">${text}<br>
              <span ${act(dismissAct(kind))} style="display:inline-block;margin-top:6px;border:1px solid #5a6170;border-radius:10px;padding:1px 10px;font-size:11.5px;color:#c4c7cc;cursor:pointer;pointer-events:auto">${T.dismiss}</span></div>`;
          const advice = (s, kind, A) => shown(s, kind) ? adviceBox(s, kind, s.state === 'advies' ? A.advBox : A.letBox)
            : s && ['letop', 'advies'].includes(s.state) ? `<div style="font-size:11px;${muted};margin-top:4px">${T.gone}</div>` : '';
          const panelS = 'margin-top:4px;padding:8px 10px;background:#22262e;border-radius:8px';
          const qS = `font-size:11px;${muted};margin-bottom:4px`, subS = `font-size:11px;${muted};margin-top:6px;line-height:1.35`;
          const thS = `${muted};font-weight:400;font-size:11px;text-align:right;padding:2px 4px;white-space:nowrap`;
          const tdS = 'color:#e8eaed;text-align:right;padding:3px 4px;border-top:1px solid #333744;white-space:nowrap';
          const td1 = 'text-align:left;padding:3px 8px 3px 0;border-top:1px solid #333744;color:#c4c7cc;white-space:nowrap';
          const monS = k => new Date(k + '-15').toLocaleString(T.loc, {month: 'short', year: '2-digit'});
          const monL = k => new Date(k + '-15').toLocaleString(T.loc, {month: 'short', year: 'numeric'});
          const nd0 = new Date(), nowKey = `${nd0.getFullYear()}-${String(nd0.getMonth() + 1).padStart(2, '0')}`;
          // Monthly table: trend column first, then newest -> oldest
          const table = (months, rows) => `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;margin-top:8px;font-size:12px">
              <tr><th></th><th style="${thS}">${T.trend}</th>${months.map(k => `<th style="${thS}">${monS(k)}</th>`).join('')}</tr>${rows}</table></div>`;
          // newest value against the middle of the other months
          const trendWord = (vals, W, badUp) => {
            if (vals.length < 2) return `<span style="${muted}">·</span>`;
            const rest = vals.slice(1).sort((x, y) => x - y), md = rest[Math.floor(rest.length / 2)];
            const c = up => (up === badUp ? '#ffa726' : '#66bb6a');
            return vals[0] > md * 1.2 + 1 ? `<span style="color:${c(true)}">${W.up}</span>`
              : vals[0] < md / 1.2 - 1 ? `<span style="color:${c(false)}">${W.down}</span>` : `<span style="${muted}">${W.flat}</span>`;
          };

          // SOC panel: is the SOC meter still right?
          let socPanel = '';
          if (sh) {
            const A = T.soc, sa = sh.attributes;
            const tr = (sa.trend || []).slice(0, variables.months || 6);
            const ago = sa.last_calibration ? Math.max(0, Math.floor((Date.now() - new Date(sa.last_calibration)) / 86400000)) : null;
            const last = sa.last_size > 0 ? A.last(f(sa.last_size, 0)) : sa.count ? A.lastNoFull : '';
            const lim = sa.limit_pct ?? 5;
            const head = sh.state === 'advies' ? A.advH(sa.count ?? 3, last) : sh.state === 'letop' ? A.letH(last) : sa.sensitivity === 'off' ? T.offH : A.okH(A.days(ago));
            const share = t => { const d = t.month === nowKey ? nd0.getDate() : new Date(+t.month.slice(0, 4), +t.month.slice(5, 7), 0).getDate(); return 30 * t.full_days / d; };
            const tip = t => [`${monL(t.month)}: ${A.dev(f(t.dev, 0))}`, t.b99 ? A.b99(f(t.b99, 0)) : '', t.jump ? A.jump(f(t.jump, 0)) : '',
              t.hang ? A.hang(f(t.hang, 0)) : '', t.no_full_days ? A.nofull(t.no_full_days) : ''].filter(x => x).join('&#10;');
            const rows = !tr.length ? '' : `<tr><td style="${td1}">${A.full}</td><td style="${tdS}">${trendWord(tr.map(share), A.words, false)}</td>
                ${tr.map(t => `<td style="${tdS}${t.month !== nowKey && t.full_days < 7 ? ';color:#ffa726;font-weight:600' : ''}">${t.full_days}</td>`).join('')}</tr>
              <tr><td style="${td1}">${A.ok}</td><td style="${tdS}">${tr[0].dev >= lim ? `<span style="color:#ffa726">${A.words.bad}</span>` : `<span style="color:#66bb6a">${A.words.good}</span>`}</td>
                ${tr.map(t => `<td title="${tip(t)}" style="${tdS};${t.dev >= lim ? 'color:#ffa726;font-weight:600' : 'color:#66bb6a'}">${t.dev >= lim ? A.off(f(t.dev, 0)) : '✓'}</td>`).join('')}</tr>`;
            socPanel = `<div style="${panelS}"><div style="${qS}">${A.q}</div><div>${sym(sh)} ${head}</div>${advice(sh, 'soc', A)}
                ${tr.length ? table(tr.map(t => t.month), rows) + `<div style="${subS}">${A.sub(f(lim, 0))}</div>` : `<div style="${subS}">${A.none}</div>`}</div>`;
          }

          // Cells panel: are the cells still in balance?
          let cellPanel = '';
          if (ch || cs) {
            const A = T.cell, ca = ch ? ch.attributes : {};
            const tr = ((ch || cs).attributes.trend || []).slice(0, variables.months || 6);
            const base = ca.base_mv, lim = ca.limit_mv ?? (base ? 2 * base : null);
            const nrm = base ? A.normal(f(base, 0)) : '';
            const now = f(ca.last_mv ?? (cs ? cs.state : null), 0);
            const head = !ch ? '' : ch.state === 'advies' ? A.advH(ca.count ?? 3, now) : ch.state === 'letop' ? A.letH(now) : ca.sensitivity === 'off' ? T.offH : tr.length ? A.okH(now, nrm) : '';
            const tip = t => [`${monL(t.month)}: ${A.spread(f(t.spread_mv, 0), nrm)}`, t.rest_h != null ? A.rest(f(t.rest_h, 1)) : '',
              t.temp_c != null ? A.temp(f(t.temp_c, 0)) : '', t.n ? A.n(t.n) : ''].filter(x => x).join('&#10;');
            const high = t => lim && t.spread_mv >= lim;
            const rows = !tr.length ? '' : `<tr><td style="${td1}">${A.row}</td><td style="${tdS}">${trendWord(tr.map(t => t.spread_mv), A.words, true)}</td>
                ${tr.map(t => `<td title="${tip(t)}" style="${tdS}${high(t) ? ';color:#ffa726;font-weight:600' : ''}">${high(t) ? '⚠ ' : ''}${f(t.spread_mv, 0)} mV</td>`).join('')}</tr>`;
            cellPanel = `<div style="${panelS}"><div style="${qS}">${A.q}</div>${head ? `<div>${sym(ch)} ${head}</div>` : ''}${advice(ch, 'cells', A)}
                ${tr.length ? table(tr.map(t => t.month), rows) + `<div style="${subS}">${A.sub(base ? f(base, 0) : null, lim ? f(lim, 0) : null)}</div>` : `<div style="${subS}">${A.none}</div>`}</div>`;
          }

          // Chart: the most recent 3 years (never before the installation date).
          // Open dot = less reliable: not completely full in the 14 days before, or cold cells.
          let chart = '';
          {
            const km = k => { const [yy, mm] = k.split('-').map(Number); return yy * 12 + mm - 1; };
            const nd = new Date(), nowI = nd.getFullYear() * 12 + nd.getMonth();
            const startI = nowI - Math.round((ea.age_years ?? 0) * 12);
            const x0 = Math.max(startI, nowI - 35), x1 = nowI;
            const span = Math.max(1, x1 - x0);
            const pts = (a.trend || []).filter(t => km(t.month) >= x0 && km(t.month) <= x1).slice().reverse();
            // drawn in real pixels: the card is on screen once the button was pressed
            const W = Math.max(260, Math.round(((this && this.offsetWidth) || 360) - 50)), H = 120, L = 28, R = 30, Tp = 10, B = 18;
            const lo = Math.min(70, Math.floor((Math.min(floor, ...pts.map(t => t.pct)) - 5) / 10) * 10);
            const hi = Math.max(100, Math.ceil(Math.max(0, ...pts.map(t => t.pct)) / 5) * 5);
            const X = i => L + (i - x0) * (W - L - R) / span;
            const Y = v => Tp + (hi - v) * (H - Tp - B) / (hi - lo);
            const dim = '#6f747b';
            let svg = '';
            for (let v = lo; v <= hi; v += 10)
              svg += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2a2e37" stroke-width="1"/><text x="${L - 5}" y="${Y(v) + 3.5}" font-size="10" fill="${dim}" text-anchor="end">${v}</text>`;
            const y0 = Math.ceil(x0 / 12), y1 = Math.floor(x1 / 12), stepY = (y1 - y0) > 6 ? 2 : 1;
            for (let yy = y0; yy <= y1; yy += stepY) {
              if (yy * 12 < x0 || yy * 12 > x1) continue;
              svg += `<line x1="${X(yy * 12)}" x2="${X(yy * 12)}" y1="${H - B}" y2="${H - B + 4}" stroke="${dim}" stroke-width="1"/><text x="${X(yy * 12)}" y="${H - 3}" font-size="10" fill="${dim}" text-anchor="middle">${yy}</text>`;
            }
            svg += `<line x1="${L}" x2="${W - R}" y1="${Y(floor)}" y2="${Y(floor)}" stroke="#ef5350" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="4 4"/><text x="${W - R + 3}" y="${Y(floor) + 3.5}" font-size="10" fill="#ef5350" fill-opacity="0.7">${f(floor, 0)}%</text>`;
            const sp = pts.map(t => [km(t.month), t.expected_pct]);
            if (!isNaN(exp) && (!sp.length || sp[sp.length - 1][0] < nowI)) sp.push([nowI, exp]);
            if (sp.length > 1) svg += `<polyline points="${sp.map(([i, v]) => `${X(i)},${Y(v)}`).join(' ')}" fill="none" stroke="#9aa0a6" stroke-opacity="0.7" stroke-width="1" stroke-dasharray="4 3"/>`;
            if (pts.length > 1) svg += `<polyline points="${pts.map(t => `${X(km(t.month))},${Y(t.pct)}`).join(' ')}" fill="none" stroke="#66bb6a" stroke-opacity="0.45" stroke-width="1.2"/>`;
            const why = t => t.why === 'both' ? `${T.why.no_calibration}, ${T.why.cold}` : (T.why[t.why] || '');
            const tip = t => `${monL(t.month)}: ${f(t.pct, 1)} % (${T.legSpec} ${f(t.expected_pct, 0)} %${t.temp_c != null ? `, ${f(t.temp_c, 0)} °C` : ''})`
              + (t.reliable === false ? `\n${T.less}: ${why(t)}` : '') + (t.ref_age_d != null ? `\n${T.refAge(f(t.ref_age_d, 0))}` : '');
            svg += pts.map(t => { const c = col(t.pct, t.expected_pct);
              return `<circle cx="${X(km(t.month))}" cy="${Y(t.pct)}" r="${pts.length > 40 ? 2.2 : 3}" fill="${t.reliable === false ? '#22262e' : c}" stroke="${c}" stroke-width="1.4"><title>${tip(t)}</title></circle>`; }).join('');
            if (pts.length) { const t = pts[pts.length - 1]; svg += `<text x="${X(km(t.month))}" y="${Y(t.pct) - 6}" font-size="10" fill="#e8eaed" text-anchor="middle">${f(t.pct, 0)}</text>`; }
            chart = `<div style="${panelS}">
                <div style="display:flex;flex-wrap:wrap;justify-content:space-between;column-gap:10px;font-size:11px;${muted}"><span>${T.chartTitle}</span><span>${T.win3}</span></div>
                ${pts.length ? `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%;height:auto;display:block;margin-top:4px">${svg}</svg>` : ''}
                ${pts.length ? '' : `<div style="font-size:11px;${muted};margin:4px 0">${T.noData}</div>`}
                <div style="font-size:10.5px;${muted};margin-top:2px"><span style="color:#66bb6a">●</span> ${T.legCap} · <span style="color:#66bb6a">○</span> ${T.legOpen} · <span style="color:#9aa0a6">┄</span> ${T.legSpec} · <span style="color:#ef5350">┄</span> ${T.legRed}</div>
              </div>`;
          }

          // The chart opens in place of the capacities (same height); SOC and Cells
          // open as a popup, so the card never grows. The foot line stays at the bottom.
          const view = (key, html) => `<div style="grid-area:1/1;min-width:0;${panel === key ? '' : 'visibility:hidden'}">${html}</div>`;
          const stack = `<div style="display:grid">${view(panel === 'chart' ? '-' : panel, boxes + bar + expLine)}${view('chart', chart)}</div>`;
          const popup = (title, html) => `<div ${act(`h._mcPanel='';`)} style="position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;cursor:default;pointer-events:auto">
              <div ${act('void 0;')} style="background:#1e2128;border:1px solid #333744;border-radius:12px;padding:14px;width:100%;max-width:560px;max-height:85vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.5);color:#e8eaed;font-size:13px;text-align:left">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="font-size:15px;font-weight:600">${name} · ${title}</span>
                  <span ${act(`h._mcPanel='';`)} title="${T.close}" style="cursor:pointer;font-size:18px;line-height:1;color:#9aa0a6;padding:2px 6px">✕</span></div>
                ${html}</div></div>`;
          const pop = panel === 'soc' && socPanel ? popup(T.soc.pill, socPanel) : panel === 'cells' && cellPanel ? popup(T.cell.pill, cellPanel) : '';

          return `<div style="display:flex;flex-direction:column;height:100%">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
              <span style="font-size:15px;font-weight:600">${name} · ${T.title}</span>
              <div style="text-align:right;flex-shrink:0;font-size:12px;color:${col(pct)}">${status}</div></div>
            ${monLine}${pills}${stack}${none}<div style="margin-top:auto">${foot}</div>${pop}</div>`;
        ]]]

  # -------------------------------------------------------------------------
  # Up to six batteries: pattern over months, newest -> oldest
  # -------------------------------------------------------------------------
  marstek_capacity_overview:
    template: marstek_capacity_base
    # no default list: button-card would merge it with yours
    custom_fields:
      body: |
        [[[
          const nl = variables.lang === 'nl';
          const T = variables.lang === 'de'
            ? {title: 'Kapazität Heimspeicher — % noch verfügbar pro Monat', bat: 'Batterie', trend: 'Trend', now: 'Jetzt', exp: 'Herstellerangabe', loc: 'de-DE', none: 'sammelt Daten', mon: {measuring: 'Messung läuft', collecting: 'sammelt Daten', no_recent_data: 'keine aktuellen Daten', sensor_missing: 'Sensor nicht verfügbar'}, legend: 'Grün: im Rahmen der Herstellerangabe (bis 5 Punkte darunter) · orange: unter Herstellerangabe · rot: 75 % oder weniger, über die Marstek-App melden. Kleine Zahl = Herstellerangabe für diesen Monat. ✓ Messung läuft · ⏳ sammelt Daten · ⚠ Verbindung prüfen oder Achtung · 🔧 Empfehlung (SOC-Drift oder Zellkalibrierung, siehe die Karte dieser Batterie).', adv: 'SOC-Drift oder Zellkalibrierung: siehe die Karte dieser Batterie'}
            : nl
            ? {title: 'Capaciteit thuisbatterijen — % nog beschikbaar per maand', bat: 'Batterij', trend: 'Trend', now: 'Nu', exp: 'Specificatie', loc: 'nl-NL', none: 'verzamelt data', mon: {measuring: 'meting werkt', collecting: 'verzamelt data', no_recent_data: 'geen recente data', sensor_missing: 'sensor niet beschikbaar'}, legend: 'Groen: volgens specificatie fabrikant (tot 5 punten eronder) · oranje: onder specificatie · rood: 75 % of lager, melden via de Marstek-app. Klein getal = specificatie voor die maand. ✓ meting werkt · ⏳ verzamelt data · ⚠ controleer de koppeling of let op · 🔧 advies (SOC-drift of celkalibratie, zie de kaart van die batterij).', adv: 'SOC-drift of celkalibratie: zie de kaart van deze batterij'}
            : {title: 'Home battery capacity — % remaining per month', bat: 'Battery', trend: 'Trend', now: 'Now', exp: 'Spec', loc: 'en-GB', none: 'collecting data', mon: {measuring: 'monitor working', collecting: 'collecting data', no_recent_data: 'no recent data', sensor_missing: 'sensor unavailable'}, legend: 'Green: within manufacturer spec (up to 5 points below) · orange: below spec · red: 75 % or lower, report via the Marstek app. Small number = spec for that month. ✓ monitor working · ⏳ collecting data · ⚠ check the connection or attention · 🔧 advice (SOC drift or cell calibration, see the card of that battery).', adv: 'SOC drift or cell calibration: see the card of this battery'};
          const f = (v, d = 0) => (v === null || v === undefined || isNaN(v)) ? '–'
            : Number(v).toLocaleString(T.loc, {minimumFractionDigits: d, maximumFractionDigits: d});
          const muted = 'color:#9aa0a6';
          const S = variables.demo ? {...states, ...variables.demo} : states;
          const list = (variables.batteries || []).slice(0, 6).map(b => typeof b === 'string' ? {id: b} : b);
          const rows = list.map(b => {
            const m = S[`sensor.marstek_${b.id}_measured_capacity`];
            const p = S[`sensor.marstek_${b.id}_capacity_pct`];
            const e = S[`sensor.marstek_${b.id}_expected_capacity`];
            const s = S[`sensor.marstek_${b.id}_monitor_status`];
            // SOC drift / cell calibration that has not been clicked away
            const adv = ['soc_health', 'cell_health'].map(k => S[`sensor.marstek_${b.id}_${k}`])
              .filter(h => h && ['letop', 'advies'].includes(h.state) && !h.attributes.dismissed);
            return {b, m, p, e, s, adv, trend: m ? (m.attributes.trend || []) : []};
          });
          const months = [...new Set(rows.flatMap(r => r.trend.map(t => t.month)))]
            .sort().reverse().slice(0, variables.months || 6);
          const mon = k => new Date(k + '-15').toLocaleString(T.loc, {month: 'short', year: '2-digit'});
          const th = s => `<th style="padding:4px 10px;text-align:right;font-weight:400;font-size:11px;${muted}">${s}</th>`;
          const head = `<tr><th style="text-align:left;font-weight:400;font-size:11px;${muted}">${T.bat}</th>
              ${th(T.trend)}${th(T.now)}${months.map(k => th(mon(k))).join('')}${th(T.exp)}</tr>`;
          const body = rows.map(r => {
            const floor = r.p ? (r.p.attributes.red_pct ?? 75) : 75;
            const tol = r.p ? (r.p.attributes.tolerance_pct ?? 5) : 5;
            const expNow = r.e ? parseFloat(r.e.state) : NaN;
            const col = (v, x = expNow) => isNaN(v) ? '#9aa0a6' : v <= floor ? '#ef5350' : v >= x - tol ? '#66bb6a' : '#ffa726';
            const name = r.b.name || r.b.id.toUpperCase();
            if (!r.m) return `<tr><td colspan="${months.length + 4}" style="color:#ef5350">sensor.marstek_${r.b.id}_… ?</td></tr>`;
            const t = r.trend.filter(x => months.includes(x.month));
            const d = t.length > 1 ? t[0].pct - t[t.length - 1].pct : 0;
            const arrow = t.length < 2 ? '·' : d > 1 ? '▲' : d < -1 ? '▼' : '▬';
            const now = parseFloat(r.p.state);
            const cells = months.map(k => {
              const c = t.find(x => x.month === k);
              return c ? `<td style="padding:4px 10px;text-align:right"><span style="font-weight:600;color:${col(c.pct, c.expected_pct)}">${f(c.pct)}</span><span style="font-size:10px;${muted}"> /${f(c.expected_pct)}</span></td>`
                       : `<td style="padding:4px 10px;text-align:right;${muted}">·</td>`;
            }).join('');
            return `<tr style="border-top:1px solid #333744">
                <td style="padding:4px 16px 4px 0;white-space:nowrap"><span style="color:${col(now)}">●</span> ${name}${r.s ? (() => {
                  const sym = {measuring: ['✓', '#66bb6a'], collecting: ['⏳', '#42a5f5'], no_recent_data: ['⚠', '#ffa726'], sensor_missing: ['⚠', '#ef5350']}[r.s.state] || ['', ''];
                  return ` <span title="${T.mon[r.s.state] || r.s.state}" style="font-size:11px;color:${sym[1]}">${sym[0]}</span>`; })() : ''}${r.adv.length ? (() => {
                  const big = r.adv.some(h => h.state === 'advies');
                  return ` <span title="${T.adv}" style="font-size:11px;color:${big ? '#ef5350' : '#ffa726'}">${big ? '🔧' : '⚠'}</span>`; })() : ''}</td>
                <td style="padding:4px 10px;text-align:right;color:${d < -1 ? col(now) : '#9aa0a6'}">${arrow}</td>
                <td style="padding:4px 10px;text-align:right;font-weight:600;color:${col(now)}">${isNaN(now) ? `<span style="font-weight:400;font-size:11px;${muted}">${T.none}</span>` : f(now, 1) + '%'}</td>
                ${cells}
                <td style="padding:4px 10px;text-align:right;${muted}">${f(parseFloat(r.e.state), 1)}%</td></tr>`;
          }).join('');
          return `<div style="font-size:15px;font-weight:600;margin-bottom:8px">${T.title}</div>
            <div style="overflow-x:auto"><table style="border-collapse:collapse;width:auto;font-size:13px">${head}${body}</table></div>
            <div style="margin-top:8px;font-size:11px;${muted}">${T.legend}</div>`;
        ]]]

views:
  - title: Battery capacity
    path: marstek
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:button-card
            template: marstek_capacity_battery
            grid_options: {columns: 12, rows: auto}
            triggers_update:
              - sensor.marstek_mt1_capacity_pct
              - sensor.marstek_mt1_monitor_status
              - sensor.marstek_mt1_measured_capacity
            variables:
              battery: mt1
              name: MT1
              lang: en
          - type: custom:button-card
            template: marstek_capacity_battery
            grid_options: {columns: 12, rows: auto}
            triggers_update:
              - sensor.marstek_mt2_capacity_pct
              - sensor.marstek_mt2_monitor_status
              - sensor.marstek_mt2_measured_capacity
            variables:
              battery: mt2
              name: MT2
              lang: en
          - type: custom:button-card
            template: marstek_capacity_overview
            grid_options: {columns: 12, rows: auto}
            triggers_update:
              - sensor.marstek_mt1_capacity_pct
              - sensor.marstek_mt1_monitor_status
              - sensor.marstek_mt2_capacity_pct
              - sensor.marstek_mt2_monitor_status
            variables:
              lang: en
              months: 3
              batteries:
                - {id: mt1, name: MT1}
                - {id: mt2, name: MT2}
