# Example cards (after adding marstek_capacity_templates.yaml to your dashboard)

# Overview of all batteries (up to 6)
type: custom:button-card
template: marstek_capacity_overview
# Redraw when one of the batteries changes (one line per battery)
triggers_update:
  - sensor.marstek_mt1_capacity_pct
  - sensor.marstek_mt1_monitor_status
  - sensor.marstek_mt2_capacity_pct
  - sensor.marstek_mt2_monitor_status
variables:
  # lang: nl        # en | nl | de; leave out to follow the language of Home Assistant
  months: 6
  batteries:
    - id: mt1
      name: MT1 veranda
    - id: mt2
      name: MT2 berging

---
# Card for one battery. The small "Chart" button under the status opens or closes the chart.
# Layout for 1 to 6 batteries: see layout-sections.yaml.
type: custom:button-card
template: marstek_capacity_battery
# Only redraw when this battery changes (keeps the chart open while you look)
triggers_update:
  - sensor.marstek_mt1_capacity_pct
  - sensor.marstek_mt1_monitor_status
  - sensor.marstek_mt1_measured_capacity
variables:
  battery: mt1
  name: MT1 veranda
