reset_measurements:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: marstek_capacity_monitor

dismiss_advice:
  fields:
    battery:
      required: false
      example: mt1
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: marstek_capacity_monitor
    kind:
      required: true
      selector:
        select:
          options:
            - soc
            - cells
          translation_key: kind

demo:
  fields:
    scenario:
      required: true
      default: normal
      selector:
        select:
          translation_key: scenario
          options:
            - normal
            - since_start
            - high_provisional
            - high_confirmed
            - drop_unconfirmed
            - drop_confirmed
            - drop_recovered
            - below_spec
            - critical
            - critical_confirmed
            - check_model
            - soc_letop
            - soc_advies
            - cells_letop
            - cells_advies
            - collecting
